

services:
  spatial-db:
    image: postgis/postgis:15-3.3
    container_name: campus_spatial_db
    environment:
      POSTGRES_DB: campus_delivery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: